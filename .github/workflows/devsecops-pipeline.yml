name: Tarea S07 - DevSecOps SAST SCA SBOM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:

      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Ejecutar Semgrep y generar JSON
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --json \
            --output semgrep-results.json \
            .

      - name: Subir reporte Semgrep
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-json-report
          path: semgrep-results.json
          if-no-files-found: warn

      - name: Quality Gate SAST - ERROR
        run: |
          python - <<'PY'
          import json
          import sys

          with open("semgrep-results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          results = data.get("results", [])

          errors = [
              r for r in results
              if str(
                  r.get("extra", {}).get("severity", "")
              ).upper() == "ERROR"
          ]

          print(f"Total hallazgos Semgrep: {len(results)}")
          print(
              f"Hallazgos severidad ERROR: {len(errors)}"
          )

          for r in errors[:20]:
              print(
                  f"- {r.get('check_id')} | "
                  f"{r.get('path')}:"
                  f"{r.get('start', {}).get('line')}"
              )

          if errors:
              print("QUALITY GATE SAST: FAILED")
              sys.exit(1)

          print("QUALITY GATE SAST: SUCCESS")
          PY


  sbom-cyclonedx:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest

    steps:

      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Generar SBOM CycloneDX JSON
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Validar archivo SBOM
        run: |
          test -s sbom.cyclonedx.json
          echo "SBOM generado correctamente"
          head -n 30 sbom.cyclonedx.json

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error


  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias del proyecto
        run: |
          npm install \
            --omit=dev \
            --ignore-scripts \
            --legacy-peer-deps

      - name: Crear directorio de reportes
        run: mkdir -p reports

      - name: Ejecutar OWASP Dependency-Check
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/reports:/report" \
            owasp/dependency-check:13.0.0 \
            --project "NodeGoat-S07" \
            --scan /src \
            --format ALL \
            --out /report \
            --nvdDatafeed "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz" \
            --failOnCVSS 7 \
            --enableExperimental

      - name: Mostrar reportes generados
        if: always()
        run: |
          echo "Contenido del directorio reports:"
          find reports -maxdepth 2 -type f -print || true

      - name: Subir reporte SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
